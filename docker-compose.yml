# Local PostgreSQL for development: docker compose up -d
# Uses port 5433 so it never clashes with a PostgreSQL already installed on your computer (port 5432).
name: verola
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: verola
      POSTGRES_PASSWORD: verola_dev_password
      POSTGRES_DB: verola
    ports:
      - "5433:5432"
    volumes:
      - verola_pgdata:/var/lib/postgresql/data
volumes:
  verola_pgdata:
