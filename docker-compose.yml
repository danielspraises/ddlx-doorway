# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddlx
      POSTGRES_PASSWORD: ddlx_dev_password
      POSTGRES_DB: ddlx
    ports:
      - "5432:5432"
    volumes:
      - ddlx_pgdata:/var/lib/postgresql/data
volumes:
  ddlx_pgdata:
